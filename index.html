<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VerdantAR — Installation Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #camera-container {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #000;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #capture-canvas {
    display: none;
  }

  #overlay-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .product-overlay {
    position: absolute;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }

  .product-overlay.active { cursor: grabbing; }

  .product-overlay img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6));
  }

  .resize-handle {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    border: 2px solid #22c55e;
    cursor: nwse-resize;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .resize-handle svg { width: 10px; height: 10px; }

  .delete-handle {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 24px;
    height: 24px;
    background: #ef4444;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
  }

  #toolbar {
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  #product-select {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    appearance: none;
    min-width: 0;
  }

  #product-select option { background: #1a1a1a; color: #fff; }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
    touch-action: manipulation;
  }

  .btn:active { opacity: 0.7; }

  .btn-add {
    background: #22c55e;
    color: #fff;
  }

  .btn-capture {
    background: #fff;
    color: #000;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-capture svg { width: 22px; height: 22px; }

  #preview-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    flex-direction: column;
    z-index: 100;
  }

  #preview-panel.show { display: flex; }

  #preview-img {
    flex: 1;
    object-fit: contain;
    width: 100%;
  }

  #preview-actions {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: rgba(0,0,0,0.9);
  }

  .btn-share {
    flex: 1;
    background: #22c55e;
    color: #fff;
    padding: 14px;
    font-size: 15px;
  }

  .btn-retake {
    background: rgba(255,255,255,0.1);
    color: #fff;
    padding: 14px 20px;
    font-size: 15px;
  }

  #hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  #no-camera {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    padding: 32px;
  }

  #no-camera.show { display: flex; }
  #no-camera p { color: rgba(255,255,255,0.6); font-size: 14px; }

  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
  }

  .flash.active { opacity: 0.8; }
</style>
</head>
<body>

<div id="camera-container">
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay-container"></div>
  <div class="flash" id="flash"></div>
  <div id="hint">Add a product, then drag to position</div>
  <div id="no-camera">
    <svg width="48" height="48" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <p>Camera access denied.<br>Please allow camera in your browser settings and reload.</p>
  </div>
</div>

<canvas id="capture-canvas"></canvas>

<div id="toolbar">
  <select id="product-select">
    <option value="foxess-cq7">FoxESS CQ7</option>
    <option value="foxess-hybrid">FoxESS Hybrid</option>
    <option value="solis-string">Solis String</option>
  </select>
  <button class="btn btn-add" id="btn-add">+ Add</button>
  <button class="btn btn-capture" id="btn-capture" title="Capture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="9"/>
    </svg>
  </button>
</div>

<div id="preview-panel">
  <img id="preview-img" alt="Captured installation preview">
  <div id="preview-actions">
    <button class="btn btn-retake" id="btn-retake">Retake</button>
    <button class="btn btn-share" id="btn-share">Save / Share</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const overlayContainer = document.getElementById('overlay-container');
const captureCanvas = document.getElementById('capture-canvas');
const previewPanel = document.getElementById('preview-panel');
const previewImg = document.getElementById('preview-img');
const hint = document.getElementById('hint');
const flash = document.getElementById('flash');
const noCam = document.getElementById('no-camera');

const PRODUCTS = {
  'foxess-cq7':      { label: 'FoxESS CQ7',      aspect: 1.1,  defaultW: 180, src: 'foxess-bess.png?v=2',     color: '#1e3a5f' },
  'foxess-hybrid':   { label: 'FoxESS Hybrid',   aspect: 0.9,  defaultW: 140, src: 'foxess-inverter.png?v=2', color: '#1e3a5f' },
  'solis-string':    { label: 'Solis String',    aspect: 0.6,  defaultW: 140, src: 'solis-inverter.png?v=2',  color: '#14532d' },
};

let capturedDataURL = null;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
  } catch (e) {
    noCam.classList.add('show');
  }
}

startCamera();

function hideHint() {
  hint.style.opacity = '0';
  setTimeout(() => hint.style.display = 'none', 500);
}

function makePlaceholderCanvas(key) {
  const p = PRODUCTS[key];
  const w = 300, h = Math.round(w / p.aspect);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = p.color;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 3;
  ctx.strokeRect(4, 4, w - 8, h - 8);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(w * 0.09)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.label, w / 2, h / 2 - 12);
  ctx.font = `${Math.round(w * 0.065)}px -apple-system, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('drag to position', w / 2, h / 2 + 20);
  return c.toDataURL();
}

function addProduct() {
  const key = document.getElementById('product-select').value;
  const p = PRODUCTS[key];
  hideHint();

  const el = document.createElement('div');
  el.className = 'product-overlay';

  const containerW = overlayContainer.offsetWidth;
  const containerH = overlayContainer.offsetHeight;
  const initW = Math.min(p.defaultW, containerW * 0.5);
  const initH = Math.round(initW / p.aspect);

  let x = (containerW - initW) / 2;
  let y = (containerH - initH) / 2;
  let w = initW, h = initH;

  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;

  const img = document.createElement('img');
  img.src = p.src || makePlaceholderCanvas(key);
  img.alt = p.label;
  img.draggable = false;

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'resize-handle';
  resizeHandle.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="#22c55e" stroke-width="1.5"><path d="M2 8L8 2M5 8L8 5M8 8L8 8"/></svg>`;

  const deleteHandle = document.createElement('div');
  deleteHandle.className = 'delete-handle';
  deleteHandle.textContent = '×';

  el.appendChild(img);
  el.appendChild(resizeHandle);
  el.appendChild(deleteHandle);
  overlayContainer.appendChild(el);

  deleteHandle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    el.remove();
  });

  let dragging = false, startX, startY, startElX, startElY;
  let resizing = false, startRX, startRY, startW, startH;

  function getPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  el.addEventListener('pointerdown', (e) => {
    if (e.target === resizeHandle || e.target === deleteHandle || resizeHandle.contains(e.target)) return;
    e.preventDefault();
    dragging = true;
    el.classList.add('active');
    el.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    startX = pos.x; startY = pos.y;
    startElX = x; startElY = y;
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const pos = getPos(e);
    x = startElX + (pos.x - startX);
    y = startElY + (pos.y - startY);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });

  el.addEventListener('pointerup', () => { dragging = false; el.classList.remove('active'); });

  resizeHandle.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    resizing = true;
    resizeHandle.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    startRX = pos.x; startRY = pos.y;
    startW = w; startH = h;
  });

  resizeHandle.addEventListener('pointermove', (e) => {
    if (!resizing) return;
    e.preventDefault();
    const pos = getPos(e);
    const dw = pos.x - startRX;
    w = Math.max(60, startW + dw);
    h = Math.round(w / p.aspect);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
  });

  resizeHandle.addEventListener('pointerup', () => { resizing = false; });
}

document.getElementById('btn-add').addEventListener('click', addProduct);

document.getElementById('btn-capture').addEventListener('click', async () => {
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 200);

  const sw = overlayContainer.offsetWidth;
  const sh = overlayContainer.offsetHeight;
  const cw = video.videoWidth || sw;
  const ch = video.videoHeight || sh;
  const scale = cw / sw;

  captureCanvas.width = cw;
  captureCanvas.height = ch;
  const ctx = captureCanvas.getContext('2d');

  ctx.drawImage(video, 0, 0, cw, ch);

  const overlays = overlayContainer.querySelectorAll('.product-overlay');
  const drawPromises = Array.from(overlays).map(el => new Promise(resolve => {
    const imgEl = el.querySelector('img');
    const rect = el.getBoundingClientRect();
    const containerRect = overlayContainer.getBoundingClientRect();
    const ox = (rect.left - containerRect.left) * scale;
    const oy = (rect.top - containerRect.top) * scale;
    const ow = rect.width * scale;
    const oh = rect.height * scale;
    const tmp = new Image();
    tmp.onload = () => {
      const iw = tmp.naturalWidth, ih = tmp.naturalHeight;
      const elAspect = ow / oh, imgAspect = iw / ih;
      let dw, dh, dx, dy;
      if (imgAspect > elAspect) {
        dw = ow; dh = ow / imgAspect;
        dx = ox; dy = oy + (oh - dh) / 2;
      } else {
        dh = oh; dw = oh * imgAspect;
        dy = oy; dx = ox + (ow - dw) / 2;
      }
      ctx.drawImage(tmp, dx, dy, dw, dh);
      resolve();
    };
    tmp.onerror = resolve;
    tmp.src = imgEl.src;
  }));

  await Promise.all(drawPromises);
  capturedDataURL = captureCanvas.toDataURL('image/jpeg', 1.0);
  previewImg.src = capturedDataURL;
  previewPanel.classList.add('show');
});

document.getElementById('btn-retake').addEventListener('click', () => {
  previewPanel.classList.remove('show');
  capturedDataURL = null;
});

document.getElementById('btn-share').addEventListener('click', async () => {
  if (!capturedDataURL) return;

  const filename = `verdant-install-${Date.now()}.jpg`;

  if (navigator.share) {
    try {
      const blob = await (await fetch(capturedDataURL)).blob();
      const file = new File([blob], filename, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Verdant Installation Preview' });
        return;
      }
    } catch (e) { /* fall through to download */ }
  }

  const a = document.createElement('a');
  a.href = capturedDataURL;
  a.download = filename;
  a.click();
});
</script>
</body>
</html>
